name: Decode staged photos
on:
  push:
    paths:
      - "staging/**"
      - ".github/workflows/decode-photos.yml"
  workflow_dispatch:
jobs:
  decode:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Decode JPEGs and commit
        run: |
          set -euo pipefail
          mkdir -p photos
          python3 <<'PY'
          import base64, pathlib, sys
          staging = pathlib.Path("staging")
          photos = pathlib.Path("photos")
          photos.mkdir(exist_ok=True)
          files = sorted(staging.glob("*.jpg.b64"))
          print("staged", len(files))
          if len(files) != 6:
              print("waiting for 6 staged files")
              sys.exit(0)
          for f in files:
              data = base64.b64decode(f.read_text().strip())
              if data[:2] != b"\xff\xd8":
                  raise SystemExit("not jpeg after decode: %s head=%r" % (f.name, data[:8]))
              dest = photos / f.name.replace(".b64", "")
              dest.write_bytes(data)
              print(dest, len(data), "ok")
          PY
          if [ ! -f photos/509392df-5228-42c2-9d29-444c882c4715.jpg ]; then
            echo "Not complete yet"
            exit 0
          fi
          rm -rf staging
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Add six portfolio JPEG photos"
          git push
