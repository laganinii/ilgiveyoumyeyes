name: Decode staged photos
on:
  push:
    paths:
      - "staging/**"
      - ".github/workflows/decode-photos.yml"
  workflow_dispatch:
jobs:
  decode:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Decode JPEGs and commit
        run: |
          set -euo pipefail
          mkdir -p photos
          python3 <<'PY'
          import base64, pathlib, sys
          staging = pathlib.Path("staging")
          photos = pathlib.Path("photos")
          photos.mkdir(exist_ok=True)
          files = sorted(staging.glob("*.jpg.b64"))
          print("staged", len(files))
          if len(files) != 6:
              raise SystemExit("expected 6 staged files, got %d" % len(files))
          for f in files:
              data = base64.b64decode(f.read_text().strip())
              if data[:2] != b"\xff\xd8":
                  raise SystemExit("not jpeg after decode: %s head=%r" % (f.name, data[:8]))
              dest = photos / f.name.replace(".b64", "")
              dest.write_bytes(data)
              print(dest, len(data), "ok")
          PY
          rm -rf staging
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add six portfolio JPEG photos"
          git push
