name: Decode staged photos
on:
  push:
    paths:
      - "staging/**"
      - "photo-b64/**"
  workflow_dispatch:
jobs:
  decode:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Decode JPEGs and commit
        run: |
          set -euo pipefail
          python3 <<'PY'
          import base64, pathlib, re, sys
          from collections import defaultdict
          staging_dirs = [pathlib.Path("photo-b64"), pathlib.Path("staging")]
          photos = pathlib.Path("photos")
          photos.mkdir(exist_ok=True)
          needed = [
            "509392df-5228-42c2-9d29-444c882c4715",
            "21161c6c-4ffe-4599-93ec-6726fce105fa",
            "da20cf6b-9cda-483c-984d-2c8a053bb53e",
            "bc45140c-5d06-495f-8f6b-071de5c2d0b6",
            "b7343179-561d-4ae9-adde-01e8a772a3d6",
            "0b49e3fb-f77b-4467-be57-dffc3c845f69",
          ]

          def write_jpeg(uid, blob, source):
              blob = "".join(blob.split())
              try:
                  data = base64.b64decode(blob, validate=False)
              except Exception as e:
                  print("b64 fail", uid, source, e)
                  return False
              if data[:2] != bytes([255, 216]):
                  print("not jpeg yet", uid, source, "nbytes", len(data))
                  return False
              dest = photos / (uid + ".jpg")
              dest.write_bytes(data)
              print(dest, len(data), source, "ok")
              return True

          ok = []
          b64_uids = set()
          files = []
          for staging in staging_dirs:
              if staging.exists():
                  files.extend([f for f in staging.iterdir() if f.is_file()])

          for f in files:
              m = re.fullmatch(r"([0-9a-f-]{36})[.]b64", f.name)
              if not m:
                  continue
              uid = m.group(1)
              b64_uids.add(uid)
              if write_jpeg(uid, f.read_text(), "b64:" + str(f.parent)):
                  ok.append(uid)

          parts = defaultdict(list)
          for f in files:
              m = re.fullmatch(r"([0-9a-f-]{36})[.]p([0-9]+)", f.name)
              if not m:
                  continue
              uid = m.group(1)
              if uid in b64_uids:
                  continue
              # prefer photo-b64 over leftover staging parts
              parts[uid].append((str(f.parent), int(m.group(2)), f))
          for uid, items in sorted(parts.items()):
              # if any photo-b64 parts exist, use only those
              if any(parent == "photo-b64" for parent, _, _ in items):
                  items = [x for x in items if x[0] == "photo-b64"]
              items.sort(key=lambda x: x[1])
              blob = "".join(p.read_text() for _, _, p in items)
              if write_jpeg(uid, blob, "parts:" + str(len(items))):
                  ok.append(uid)
          print("decoded", len(ok), ok)
          if set(ok) < set(needed):
              print("waiting for all six valid jpegs")
              sys.exit(0)
          pathlib.Path(".decode-ok").write_text("ok\n")
          PY
          if [ ! -f .decode-ok ]; then
            echo "not ready"
            exit 0
          fi
          rm -rf staging photo-b64 .decode-ok
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Add six portfolio JPEG photos"
          git push
