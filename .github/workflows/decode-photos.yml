name: Decode staged photos
on:
  push:
    paths:
      - "staging/**"
  workflow_dispatch:
jobs:
  decode:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Decode JPEGs and commit
        run: |
          set -euo pipefail
          python3 <<'PY'
          import base64, pathlib, sys
          from collections import defaultdict
          staging = pathlib.Path("staging")
          if not staging.exists():
              print("no staging dir")
              sys.exit(0)
          parts = defaultdict(list)
          for f in staging.iterdir():
              if not f.is_file():
                  continue
              if ".p" not in f.name:
                  continue
              uid, part = f.name.rsplit(".p", 1)
              parts[uid].append((part, f))
          print("photos staged", len(parts), "ids", sorted(parts))
          if len(parts) != 6:
              print("waiting for 6 photos")
              sys.exit(0)
          photos = pathlib.Path("photos")
          photos.mkdir(exist_ok=True)
          for uid, items in sorted(parts.items()):
              items.sort()
              blob = "".join(p.read_text() for _, p in items)
              data = base64.b64decode(blob)
              if data[:2] != b"\xff\xd8":
                  raise SystemExit("not jpeg: %s head=%r parts=%d" % (uid, data[:8], len(items)))
              dest = photos / (uid + ".jpg")
              dest.write_bytes(data)
              print(dest, len(data), "parts", len(items), "ok")
          PY
          test -f photos/509392df-5228-42c2-9d29-444c882c4715.jpg
          rm -rf staging
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Add six portfolio JPEG photos"
          git push
